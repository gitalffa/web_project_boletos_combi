<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel del operador | Tepic → Batanga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=1" />
    <link rel="stylesheet" href="css/admin.css?v=1" />
  </head>
  <body>
    <header class="encabezado">
      <p class="encabezado__transportista">Panel del operador</p>
      <h1 class="encabezado__ruta">
        Tepic <span class="encabezado__flecha">→</span> Batanga
      </h1>
    </header>

    <main class="contenedor">
      <!-- PANTALLA: Login -->
      <section id="pantalla-login-operador" class="pantalla activa">
        <h2>Iniciar sesión</h2>
        <form id="formulario-login-operador" novalidate>
          <div class="campo">
            <label for="usuario-operador">Usuario</label>
            <input type="text" id="usuario-operador" autocomplete="username" />
          </div>
          <div class="campo">
            <label for="contrasena-operador">Contraseña</label>
            <input
              type="password"
              id="contrasena-operador"
              autocomplete="current-password"
            />
            <p class="campo-error" id="error-login-operador"></p>
          </div>
          <button type="submit" class="boton-primario">Entrar</button>
        </form>
      </section>

      <!-- PANTALLA: Cambio de contraseña (obligatorio la primera vez) -->
      <section id="pantalla-cambiar-contrasena" class="pantalla">
        <h2>Cambia tu contraseña</h2>
        <p class="texto-ayuda" id="texto-cambio-obligatorio"></p>
        <form id="formulario-cambiar-contrasena" novalidate>
          <div class="campo">
            <label for="contrasena-actual">Contraseña actual</label>
            <input
              type="password"
              id="contrasena-actual"
              autocomplete="current-password"
            />
          </div>
          <div class="campo">
            <label for="contrasena-nueva">Contraseña nueva</label>
            <input
              type="password"
              id="contrasena-nueva"
              autocomplete="new-password"
            />
          </div>
          <div class="campo">
            <label for="contrasena-nueva-confirmar"
              >Confirma tu contraseña nueva</label
            >
            <input
              type="password"
              id="contrasena-nueva-confirmar"
              autocomplete="new-password"
            />
          </div>
          <p id="mensaje-cambiar-contrasena" class="campo-error"></p>
          <button type="submit" class="boton-primario">
            Guardar contraseña nueva
          </button>
          <button
            type="button"
            id="boton-cancelar-cambio-contrasena"
            class="boton-secundario"
            hidden
          >
            Cancelar
          </button>
        </form>
      </section>

      <!-- PANTALLA: Lista de pasajeros de hoy -->
      <!-- PANTALLA: Lista de pasajeros de hoy -->
      <section id="pantalla-lista-operador" class="pantalla">
        <button
          type="button"
          id="boton-menu-hamburguesa-operador"
          class="boton-hamburguesa"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="menu-panel-operador"
        >
          <span></span><span></span><span></span>
        </button>

        <nav id="menu-panel-operador" class="menu-panel">
          <button
            type="button"
            id="boton-ir-a-cambiar-contrasena"
            class="tab-admin"
          >
            Cambiar mi contraseña
          </button>
          <hr class="menu-panel__separador" />
          <button
            type="button"
            id="boton-cerrar-sesion-operador"
            class="menu-panel__cerrar-sesion"
          >
            Cerrar sesión
          </button>
        </nav>

        <p class="texto-ayuda">
          Hola, <strong id="nombre-operador"></strong> — hoy (<span
            id="fecha-operador"
          ></span
          >)
        </p>

        <div id="contenedor-salidas"></div>
      </section>
    </main>

    <script type="module" src="js/operador.js?v=1"></script>
  </body>
</html>
