<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel del operador | Tepic → Batanga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=1" />
    <link rel="stylesheet" href="css/admin.css?v=1" />
  </head>
  <body>
    <header class="encabezado">
      <p class="encabezado__transportista">Panel del operador</p>
      <h1 class="encabezado__ruta">
        Tepic <span class="encabezado__flecha">→</span> Batanga
      </h1>
    </header>

    <main class="contenedor">
      <!-- PANTALLA: Login -->
      <section id="pantalla-login-operador" class="pantalla activa">
        <h2>Iniciar sesión</h2>
        <form id="formulario-login-operador" novalidate>
          <div class="campo">
            <label for="usuario-operador">Usuario</label>
            <input type="text" id="usuario-operador" autocomplete="username" />
          </div>
          <div class="campo">
            <label for="contrasena-operador">Contraseña</label>
            <input
              type="password"
              id="contrasena-operador"
              autocomplete="current-password"
            />
            <p class="campo-error" id="error-login-operador"></p>
          </div>
          <button type="submit" class="boton-primario">Entrar</button>
        </form>
      </section>

      <!-- PANTALLA: Lista de pasajeros de hoy -->
      <section id="pantalla-lista-operador" class="pantalla">
        <p class="texto-ayuda">
          Hola, <strong id="nombre-operador"></strong> — hoy (<span
            id="fecha-operador"
          ></span
          >)
        </p>

        <div id="contenedor-salidas"></div>

        <button
          type="button"
          id="boton-cerrar-sesion-operador"
          class="boton-secundario"
        >
          Cerrar sesión
        </button>
      </section>
    </main>

    <script type="module" src="js/operador.js?v=1"></script>
  </body>
</html>
